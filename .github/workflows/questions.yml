name: Preguntas y base de datos

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Qué hacer"
        type: choice
        options:
          - rutina-mensual         # genera el mes siguiente solo si quedan pocos días de retos
          - generar-retos          # lote: Wikidata → preguntas → calendario → Supabase (usa «days»)
          - preparar-base-datos    # aplica migraciones y datos de países/ciudades
          - comprobar-reservas     # avisa si quedan pocos días con reto
          - informe-retos          # qué preguntas multimedia hay en los retos
          - registrar-admin        # da permisos de administración a la cuenta con el correo indicado
        default: rutina-mensual
      admin_email:
        description: "Correo de la cuenta de administración (solo en «registrar-admin»)"
        default: ""
      days:
        description: "Días de retos a generar (solo en «generar-retos»)"
        default: "30"
      replace:
        description: "Sustituir los retos ya programados a partir de mañana (con los tipos de pregunta nuevos)"
        type: boolean
        default: false
      ai:
        description: "Usar IA para crear las preguntas de emojis"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * 1"   # cada lunes: comprobar que quedan retos programados
  # Cada lunes: rutina-mensual (genera 30 días más si quedan menos de 15)
  # Lanzar una tarea editando ops/tarea.txt (una línea: generar-retos | preparar-base-datos)
  push:
    branches: [main]
    paths: ["ops/tarea.txt"]

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      DAYS: ${{ github.event.inputs.days || '30' }}
      USE_AI: ${{ github.event.inputs.ai || 'true' }}
      REPLACE: ${{ github.event.inputs.replace || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Decidir la tarea
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ github.event.inputs.task }}";
          elif [ "${{ github.event_name }}" = "push" ]; then t="$(head -n1 ops/tarea.txt | tr -d '[:space:]')";
          else t="rutina-mensual"; fi
          echo "TASK=$t" >> "$GITHUB_ENV"; echo "Tarea: $t"
          if [ "$t" = "generar-retos" ] || [ "$t" = "rutina-mensual" ]; then echo "GEN=true" >> "$GITHUB_ENV"; else echo "GEN=false" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt

      # Caché de Wikidata (una semana) y de emojis: repetir un intento no lo descarga ni paga de nuevo
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: wikidata-${{ github.run_id }}
          restore-keys: wikidata-
      - name: Recuperar emojis ya generados
        if: env.GEN == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pipeline/data
          if [ -s pipeline/data/emoji.json ]; then echo "emojis ya en caché"; exit 0; fi
          id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=preguntas&per_page=1" \
            | python3 -c "import sys,json;a=json.load(sys.stdin).get('artifacts') or [];print(a[0]['id'] if a else '')")
          if [ -z "$id" ]; then echo "sin artefacto previo"; exit 0; fi
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/preguntas.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"
          python3 -I tool/restore_emoji.py /tmp/preguntas.zip pipeline/data

      - run: sudo apt-get install -y -q ffmpeg >/dev/null

      - name: Preparar base de datos
        if: env.TASK == 'preparar-base-datos'
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          tool/db_setup.sh

      - name: Registrar administrador
        if: env.TASK == 'registrar-admin'
        env:
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          [ -n "$ADMIN_EMAIL" ] || { echo "Falta el correo (admin_email)"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v email="$ADMIN_EMAIL" <<'SQL'
          select id as uid from auth.users where lower(email) = lower(:'email') \gset
          \if :{?uid}
            update public.app_config
               set value = (select coalesce(jsonb_agg(distinct u), '[]'::jsonb)
                              from jsonb_array_elements_text(value || to_jsonb(:'uid'::text)) u)
             where key = 'admin_uids';
            select 'Administrador registrado: ' || :'uid' as resultado;
          \else
            \echo 'No existe ninguna cuenta con ese correo: créala primero en Supabase (Authentication → Users)'
            select 1/0;
          \endif
          SQL

      - name: Generar retos
        if: env.TASK == 'generar-retos'
        working-directory: pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m didacquiz_pipeline yearly --days "$DAYS" \
            $( [ "$USE_AI" = "true" ] && echo --ai ) \
            $( [ "$REPLACE" = "true" ] && echo --replace-from tomorrow ) \
            2>&1 | tee ../generacion.log

      - name: Guardar resultados (preguntas, descartes, revisión)
        if: always() && env.GEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preguntas
          path: |
            pipeline/out/
            pipeline/data/emoji.json
            pipeline/data/music.json

      - name: Guardar caché de datos
        if: always() && env.GEN == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: wikidata-${{ github.run_id }}

      - name: Publicar el registro (rama ci-questions)
        if: always() && env.GEN == 'true'
        run: |
          tmp=$(mktemp -d); tail -n 400 generacion.log > "$tmp/generacion.log" 2>/dev/null || echo "sin registro" > "$tmp/generacion.log"
          echo "run: ${{ github.run_id }} commit: ${{ github.sha }}" > "$tmp/SUMMARY.txt"
          cd "$tmp" && git init -q && git checkout -q -b ci-questions
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "registro ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-questions

      - name: Rutina mensual (genera el mes siguiente si hace falta)
        if: env.TASK == 'rutina-mensual'
        working-directory: pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m didacquiz_pipeline monthly --min-days 15 --days 30 \
            $( [ -n "$ANTHROPIC_API_KEY" ] && echo --ai ) 2>&1 | tee ../generacion.log

      - name: Avisar de que se ha generado un mes nuevo
        if: env.TASK == 'rutina-mensual' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > aviso.md
          import json, pathlib
          p = pathlib.Path("pipeline/out/mensual.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          if not d.get("generated"):
              raise SystemExit(0)
          print(f"Se han programado {d['days']} retos nuevos: del {d['from']} al {d['to']}.")
          print()
          print(f"Quedaban {d['left_before']} días de reserva. Tipos de reto: {d['kinds']}.")
          print()
          print("Todo es automático; este aviso es solo informativo.")
          PY
          if [ -s aviso.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "DidacCine Quiz: mes nuevo de retos generado" --body-file aviso.md
          fi

      - name: Avisar si la rutina mensual ha fallado
        if: env.TASK == 'rutina-mensual' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "DidacCine Quiz: la generación mensual de retos ha fallado" \
            --body "Revisa la ejecución: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Si quedan pocos días de retos, lánzala a mano desde Actions (tarea rutina-mensual)."

      - name: Informe de retos
        if: env.TASK == 'informe-retos'
        working-directory: pipeline
        run: |
          python -m didacquiz_pipeline report 2>&1 | tee ../informe.log
          tmp=$(mktemp -d); cp ../informe.log "$tmp/informe.log"; echo "run: ${{ github.run_id }}" > "$tmp/SUMMARY.txt"
          cd "$tmp" && git init -q && git checkout -q -b ci-report
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "informe"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report

      - name: Comprobar reservas
        if: env.TASK == 'comprobar-reservas'
        working-directory: pipeline
        run: python -m didacquiz_pipeline check --min-days 45
