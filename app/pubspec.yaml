name: didac_quiz
description: "DidacCine Quiz: el reto diario de cine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_mobile_ads: ">=6.0.0 <100.0.0"
  share_plus: ^11.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  audioplayers: ">=6.0.0 <100.0.0"
  youtube_player_iframe: ^6.0.2

# shared_preferences_android 2.5.x (17 oct 2026) pasó a JNI y en la APK de
# release falla al arrancar (NoSuchMethodError en SharedPreferencesApiRegistrar.getAll):
# la app se quedaba en «Algo ha fallado. Revisa tu conexión.». Se fija la última
# versión buena hasta que la prueba en emulador diga «arranque: OK» con una nueva.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/world_map.png
  fonts:
    - family: Bebas
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
        - asset: assets/fonts/Outfit-800.ttf
          weight: 900
